name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  clippy-fips:
    name: Clippy (FIPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --no-default-features --features agent,crypto-fips -- -D warnings

  clippy-cli:
    name: Clippy (CLI without MIB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --no-default-features --features agent,cli,crypto-rustcrypto -- -D warnings

  feature-checks:
    name: Feature combination checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib --no-default-features
      - run: cargo test --locked --test v3_without_crypto --no-default-features
      - run: cargo test --locked --doc --no-default-features
      - run: cargo check --locked --examples --no-default-features
      - run: cargo test --locked --lib --bins --no-default-features --features cli
      - run: cargo test --locked --lib --bins --no-default-features --features cli,crypto-rustcrypto
      - run: cargo test --locked --lib --bins --no-default-features --features cli,crypto-fips
      - run: cargo test --locked --lib --bins --no-default-features --features cli,crypto-rustcrypto,crypto-fips
      - run: cargo test --locked --no-default-features --features crypto-rustcrypto --test kat
      - run: cargo test --locked --no-default-features --features crypto-fips --test kat
      - run: cargo test --locked --all-features
      - run: cargo check --locked --all-targets --all-features

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ['1.88', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: |
          cargo test --locked --features agent,crypto-rustcrypto,cli,mib,rt-multi-thread --lib
          cargo test --locked --tests --features agent,crypto-rustcrypto,cli,mib,rt-multi-thread

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test and build docs
        run: |
          cargo test --locked --doc --all-features
          cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Container integration tests - run separately as they require Docker
  container-tests:
    name: Container Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build test container
        uses: docker/build-push-action@v7
        with:
          context: tests/containers/snmpd
          load: true
          tags: async-snmp-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container tests
        run: cargo test --locked --test interop --features agent,crypto-rustcrypto,cli,mib,rt-multi-thread -- --ignored
